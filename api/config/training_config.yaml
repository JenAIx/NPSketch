# NPSketch AI Training Configuration
# Version: 1.1.0
# Last Updated: 2025-12-29

# Training defaults
training:
  # Default training parameters
  defaults:
    train_split: 0.8
    num_epochs: 50
    learning_rate: 0.001
    batch_size: 8
    use_augmentation: true
    use_normalization: true
  
  # Parameter constraints
  constraints:
    train_split_min: 0.1
    train_split_max: 0.9
    num_epochs_min: 1
    num_epochs_max: 1000
    learning_rate_min: 0.00001
    learning_rate_max: 0.1
    batch_size_min: 1
    batch_size_max: 128
  
  # Learning rate scheduling
  lr_scheduling:
    enabled: true
    strategy: "reduce_on_plateau"  # ReduceLROnPlateau
    factor: 0.5                    # Reduce by 50%
    patience: 5                     # Wait 5 epochs
    min_lr: 0.000001               # Minimum LR (1e-6)
    threshold: 0.001               # Min change to count as improvement
  
  # Differential learning rates
  differential_lr:
    enabled: true
    backbone_multiplier: 0.1       # Backbone LR = LR * 0.1
  
  # Regularization
  regularization:
    dropout: 0.5                   # Dropout rate (0.0 - 1.0)
    weight_decay: 0.0001           # L2 regularization (1e-4, AdamW-like)
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15                   # Wait 15 epochs without improvement
    min_delta: 0.001               # Minimum improvement threshold

# Data augmentation configuration
augmentation:
  # Pre-shrink for margin creation (NEW)
  pre_shrink:
    enabled: true
    factor: 0.95  # 5% shrink creates ~14px margins for translation
  
  # Transformation ranges
  rotation_range: [-5, 5]  # degrees (increased from ±3° for diversity)
  translation_range: [-3, 3]  # pixels (realistic with 14px margins)
  scale_range: [0.95, 1.05]  # scale factor
  
  # Number of augmentations per image
  num_augmentations: 6  # Optimal for dataset size (1 original + 6 augmented = 7 total)
  
  # Diversity quality control (NEW)
  diversity_control:
    enabled: true
    
    # Similarity thresholds (SSIM: 1.0 = identical, 0.0 = completely different)
    similarity_to_original_max: 0.95      # Reject if >95% similar to original
    similarity_between_augs_max: 0.93     # Reject if >93% similar to other augs (more strict)
    
    # Retry behavior
    max_attempts_per_augmentation: 10     # Max attempts to find diverse augmentation
    progressive_aggressiveness: true      # Increase params on each retry
    
    # Metrics & reporting
    metric: "ssim"                        # Structural Similarity Index
    save_similarity_matrix: true          # Save NxN similarity matrix in metadata
    log_diversity_stats: true             # Log acceptance/rejection statistics
  
  # Progressive aggressiveness multipliers (per retry attempt)
  progressive_params:
    rotation_multiplier_per_attempt: 0.15  # +15% per attempt
    translation_multiplier_per_attempt: 0.20  # +20% per attempt
    warping_displacement_increase: 3       # +3px per attempt
    max_rotation: 8                        # Cap at ±8°
    max_translation: 5                     # Cap at ±5px
    max_warping_displacement: 25           # Cap at 25px
  
  # Augmentation type distribution
  augmentation_mix:
    rotation_translation_ratio: 0.50  # 50% - pure rotation + translation
    warping_only_ratio: 0.33          # 33% - pure warping
    warping_combined_ratio: 0.17      # 17% - warping + rotation + translation
  
  # Warping settings
  warping:
    displacement_range: [15, 20]  # Variable displacement
    control_points: 9             # 3x3 grid
    safety_margin: 15             # Edge safety margin
  
  # Quality settings
  binarization_threshold: 175
  line_thickness: 2  # pixels (after normalization)
  
  # Exclude near-zero transforms (for diversity)
  exclude_near_zero:
    rotation_min_abs: 2.0  # Initial rotation must be ≥2° or ≤-2°
    translation_min_abs: 1  # Initial translation must be ≥1px

# Synthetic bad images configuration
synthetic:
  # Default settings
  defaults:
    n_samples: 50
    complexity_levels: 5
    score_threshold: 20.0  # Max score for "bad" images
    require_real_bad_lines: false  # Continue if no real bad lines found
  
  # Image generation settings
  generation:
    image_size: [568, 274]  # width, height
    min_lines: 5
    max_lines: 20
    
  # Complexity-based ratios
  complexity:
    low:  # 0.0 - 0.3
      real_bad_ratio: 0.8
      reference_ratio: 0.2
      random_ratio: 0.0
    medium:  # 0.3 - 0.7
      real_bad_ratio: 0.5
      reference_ratio: 0.3
      random_ratio: 0.2
    high:  # 0.7 - 1.0
      real_bad_ratio: 0.3
      reference_ratio: 0.3
      random_ratio: 0.4
  
  # Line modification settings
  modifications:
    curves:
      min_curvature: 0.1
      max_curvature: 0.4
    tremor:
      min_strength: 1.0
      max_strength: 3.5
    shortening:
      min_factor: 0.6
      max_factor: 0.9
  
  # Caching settings
  cache:
    enabled: true
    ttl_seconds: 3600  # 1 hour

# Model architecture
model:
  # ResNet-18 settings
  architecture: "resnet18"
  pretrained: true
  backbone_trainable: true
  
  # Head architecture
  head:
    hidden_size: 256
    dropout: 0.5
  
  # Output activation (for regression)
  regression:
    use_sigmoid: true  # Ensures output in [0, 1] for normalized targets
  
  # Device settings
  device: "cpu"  # or "cuda" if GPU available
  
  # Model storage
  save_dir: "/app/data/models"
  checkpoint_format: "{name}_{timestamp}.pth"

# Image processing
image_processing:
  # Target size for all images
  target_size: [568, 274]  # width, height
  
  # Line normalization
  line_normalization:
    method: "zhang_suen"  # Thinning algorithm
    target_thickness: 2  # pixels (after dilation)
  
  # Auto-cropping
  auto_crop:
    enabled: true
    padding: 5  # pixels
    min_content_ratio: 0.01  # Minimum 1% content

# Data split strategies
split_strategy:
  # Regression split
  regression:
    method: "stratified_bins"  # or "random"
    default_bins: 5
    min_samples_per_bin: 2
  
  # Classification split
  classification:
    method: "stratified_classes"
    min_samples_per_class: 2

# Logging configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  # File logging
  file:
    enabled: true
    path: "/app/data/logs/training.log"
    max_bytes: 10485760  # 10 MB
    backup_count: 5
    level: "DEBUG"
  
  # Console logging
  console:
    enabled: true
    level: "INFO"
  
  # Module-specific log levels
  loggers:
    "ai_training.data_loader": "INFO"
    "ai_training.trainer": "INFO"
    "ai_training.synthetic_bad_images": "INFO"
    "ai_training.data_augmentation": "WARNING"

# Database
database:
  # SQLite settings
  path: "/app/data/npsketch.db"
  
  # Query settings
  query_timeout: 30  # seconds
  max_retries: 3
  retry_delay: 1  # seconds

# Performance & Resources
performance:
  # Worker settings
  num_workers: 0  # DataLoader workers (0 = main thread)
  
  # Memory settings
  pin_memory: false
  
  # Batch processing
  prefetch_factor: 2

# Validation & Constraints
validation:
  # Minimum dataset sizes
  min_total_images: 2
  min_labeled_images: 2
  min_feature_samples: 2
  
  # Recommended dataset sizes
  recommended_total_images: 50
  recommended_with_augmentation: 100
  
  # Class imbalance warnings
  max_class_imbalance_ratio: 10  # Warn if largest/smallest > 10

