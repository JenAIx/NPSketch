<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Tests — NPSketch</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; font-size: .92em; }
        th { background: #f8f9fa; }
        .err-ok { color: #28a745; } .err-mid { color: #ffc107; } .err-bad { color: #dc3545; }
        .summary { margin-top: 14px; padding: 12px 16px; background: #f8f9fa; border-radius: 8px; }
        select, button { padding: 10px; border: 2px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/index.html" class="back-link">← Main</a>
        <h1>🧪 Run Tests</h1>
        <p class="subtitle">Batch-evaluate a trained model over your drawn test images (predicted vs. expected score).</p>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <select id="modelSelect" style="min-width:320px;"><option value="">Loading models…</option></select>
            <button class="btn" id="runBtn" onclick="runTests()">▶ Run</button>
        </div>

        <div id="summary"></div>
        <div id="results"></div>
    </div>

    <script>
        async function loadModels() {
            const sel = document.getElementById('modelSelect');
            try {
                const data = await (await fetch('/api/ai-training/models')).json();
                const models = data.models || [];
                if (!models.length) { sel.innerHTML = '<option value="">No models trained yet</option>'; return; }
                sel.innerHTML = models.map(m => `<option value="${m.filename}">${m.feature} — ${new Date(m.created_at).toLocaleDateString()}</option>`).join('');
            } catch (e) { sel.innerHTML = '<option value="">Error loading models</option>'; }
        }

        async function runTests() {
            const model = document.getElementById('modelSelect').value;
            if (!model) { alert('Select a model first'); return; }
            const btn = document.getElementById('runBtn');
            btn.disabled = true; btn.textContent = '⏳ Running…';
            document.getElementById('summary').innerHTML = '';
            document.getElementById('results').innerHTML = '';
            try {
                const data = await (await fetch('/api/ai-training/models/run-on-test-images', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ model_filename: model })
                })).json();
                renderResults(data);
            } catch (e) {
                document.getElementById('summary').innerHTML = `<div class="summary">Error: ${e.message}</div>`;
            } finally { btn.disabled = false; btn.textContent = '▶ Run'; }
        }

        function renderResults(data) {
            const s = data.summary || {};
            let html = `<div class="summary"><strong>${s.count || 0}</strong> test images · mode: <strong>${s.training_mode}</strong>`;
            if (s.mae !== undefined) html += ` · <strong>MAE ${s.mae}</strong>`;
            html += '</div>';
            document.getElementById('summary').innerHTML = html;

            const rows = data.results || [];
            if (!rows.length) {
                document.getElementById('results').innerHTML = '<p style="color:#999;margin-top:16px;">No drawn test images yet — create some on the “Draw &amp; Evaluate” page.</p>';
                return;
            }
            const cls = (e) => e === undefined ? '' : (e <= 3 ? 'err-ok' : e <= 8 ? 'err-mid' : 'err-bad');
            document.getElementById('results').innerHTML = `
                <table>
                    <thead><tr><th>#</th><th>Name</th><th>Expected</th><th>Predicted</th><th>Abs. error</th></tr></thead>
                    <tbody>${rows.map(r => `
                        <tr>
                            <td>${r.id}</td><td>${r.name}</td>
                            <td>${r.expected ?? '—'}</td><td>${r.predicted}</td>
                            <td class="${cls(r.abs_error)}">${r.abs_error ?? '—'}</td>
                        </tr>`).join('')}</tbody>
                </table>`;
        }

        loadModels();
    </script>
</body>
</html>
