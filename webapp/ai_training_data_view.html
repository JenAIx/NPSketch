<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPSketch - View Training Data</title>
    
    <!-- Global Common Styles (ALL pages) -->
    <link rel="stylesheet" href="/css/common.css">
    
    <!-- AI Training Specific Styles -->
    <link rel="stylesheet" href="/css/ai_training_common.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        /* back-link style from common.css */
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        /* Stats Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e9ecef;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 8px;
            font-size: 0.95em;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }
        
        /* Data Table */
        .data-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .data-row {
            display: grid;
            grid-template-columns: 60px 150px 100px 100px 100px 120px 100px 1fr 50px;
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
            align-items: center;
        }
        
        .data-row:hover:not(.header) {
            background: #f8f9fa;
        }
        
        .data-row.header {
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        
        .data-row.header .data-cell {
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }
        
        .data-row.header .data-cell:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .sort-icon {
            font-size: 0.8em;
            opacity: 0.5;
        }
        
        .sort-icon.active {
            opacity: 1;
        }
        
        .data-cell {
            font-size: 0.9em;
            color: #495057;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .data-row.header .data-cell {
            color: white;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge.mat {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .badge.ocs {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.drawn {
            background: #e7e3ff;
            color: #5a3d99;
        }
        
        .badge.upload {
            background: #cfe2ff;
            color: #084298;
        }
        
        .badge.copy {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge.recall {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge.undefined {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .badge.has-features {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.missing-features {
            background: #f8d7da;
            color: #721c24;
            font-weight: 700;
        }
        
        .delete-icon {
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
            opacity: 0.6;
            text-align: center;
        }
        
        .delete-icon:hover {
            opacity: 1;
            background: #ffebee;
            transform: scale(1.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #dc3545;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            color: white;
        }
        
        .modal-close:hover {
            background: #c82333;
        }
        
        .modal-header h2 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .modal-images {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .modal-images-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .modal-image-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        
        .modal-image-section h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .modal-image-section h4 {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 8px;
        }
        
        .modal-image-section img {
            width: 100%;
            border-radius: 6px;
            background: white;
            padding: 10px;
        }
        
        .image-meta {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }
        
        .image-meta p {
            margin: 5px 0;
        }
        
        .feature-editor {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .feature-editor h3 {
            color: #856404;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .feature-list {
            background: white;
            border-radius: 6px;
            padding: 10px;
            margin: 15px 0;
        }
        
        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .feature-item:last-child {
            border-bottom: none;
        }
        
        .feature-key {
            font-weight: 600;
            color: #495057;
        }
        
        .feature-value {
            color: #667eea;
            font-weight: 600;
        }
        
        .feature-input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .feature-input-group input {
            flex: 1;
            padding: 8px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
        }
        
        .feature-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .pagination button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination span {
            color: #666;
            font-weight: 600;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
        }

        .tooltip-wrapper {
            position: relative;
            display: inline-block;
        }

        .tooltip-wrapper::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 10;
        }

        .tooltip-wrapper:hover::after,
        .tooltip-wrapper:focus-within::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container hexagon-pattern">
        <a href="/index.html" class="back-link">← Main</a>
        
        <h1>📊 View Training Data</h1>
        <p class="subtitle">Browse and manage uploaded AI training images</p>
        
        <div class="alert" id="alert"></div>
        
        <!-- Statistics Dashboard -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalImages">-</div>
                <div class="stat-label">Total Images</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="matCount">-</div>
                <div class="stat-label">MAT Drawings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="ocsCount">-</div>
                <div class="stat-label">OCS Ratings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="patientCount">-</div>
                <div class="stat-label">Patients</div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 20px; flex-wrap: wrap;">
                <h2 style="margin: 0;">Training Data Images</h2>
                <div id="filterControls" style="display: flex; gap: 10px; flex: 1; max-width: 700px; align-items: center;">
                    <label id="loadLimitLabel" style="display: flex; align-items: center; gap: 6px; background: #e7e3ff; padding: 6px 10px; border-radius: 6px; font-size: 0.9em; white-space: nowrap;">
                        <span style="color: #5a3d99; font-weight: 600;">Load</span>
                        <select id="loadLimitSelect" onchange="changeLoadLimit(this.value)" style="padding: 4px 8px; border: 1px solid #dee2e6; border-radius: 4px; cursor: pointer;">
                            <option value="10" selected>10</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="1000">1000</option>
                            <option value="5000">5000</option>
                            <option value="10000">10000</option>
                        </select>
                    </label>
                    <label id="filterMissingLabel" style="display: flex; align-items: center; gap: 6px; background: #fff3cd; padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 0.9em;">
                        <input type="checkbox" id="filterMissing" onchange="searchData()" style="cursor: pointer;">
                        <span style="color: #856404; font-weight: 600;">Only Missing</span>
                    </label>
                    <input type="text"
                           id="searchInput" 
                           placeholder="🔍 Search ID, Patient, Task, Source, Date..." 
                           style="flex: 1; padding: 10px; border: 2px solid #dee2e6; border-radius: 6px; font-size: 0.95em;"
                           oninput="searchData()">
                    <button id="clearBtn" class="btn btn-secondary btn-small" onclick="clearSearch()" style="white-space: nowrap;">Clear</button>
                </div>
            </div>
            
            <div class="data-table">
                <div class="data-row header">
                    <div class="data-cell" onclick="sortBy('id')">
                        <span>ID</span>
                        <span class="sort-icon" id="sort-id">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('patient')">
                        <span>Patient</span>
                        <span class="sort-icon" id="sort-patient">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('task')">
                        <span>Task</span>
                        <span class="sort-icon" id="sort-task">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('source')">
                        <span>Source</span>
                        <span class="sort-icon" id="sort-source">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('resolution')">
                        <span>Resolution</span>
                        <span class="sort-icon" id="sort-resolution">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('date')">
                        <span>Date</span>
                        <span class="sort-icon" id="sort-date">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('features')">
                        <span>Features</span>
                        <span class="sort-icon" id="sort-features">↕</span>
                    </div>
                    <div class="data-cell" onclick="sortBy('filename')">
                        <span>Original File</span>
                        <span class="sort-icon" id="sort-filename">↕</span>
                    </div>
                    <div class="data-cell" style="cursor: default;">
                        <span></span>
                    </div>
                </div>
                <div id="dataRows"></div>
            </div>
            
            <div class="pagination">
                <button onclick="changePage(-1)" id="prevBtn">← Previous</button>
                <span id="pageInfo">Page 1</span>
                <button onclick="changePage(1)" id="nextBtn">Next →</button>
                <span style="margin-left: 20px; color: #666;">|</span>
                <span style="color: #666; margin-left: 20px;">Items per page:</span>
                <select onchange="changePageSize(this.value)" id="pageSizeSelect" style="padding: 6px 12px; border: 2px solid #dee2e6; border-radius: 6px; cursor: pointer; margin-left: 8px;">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span id="itemsInfo" style="margin-left: 20px; color: #666; font-size: 0.95em;"></span>
            </div>
        </div>
    </div>
    
    <!-- Preview Modal -->
    <div class="modal" id="previewModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <p style="color: #666;" id="modalSubtitle"></p>
            </div>
            <div class="modal-images" id="modalImages"></div>
        </div>
    </div>

    <script src="/js/component_result.js?v=2"></script>
    <script>
        let existingData = [];
        let allData = [];  // Store all loaded data for client-side search
        let currentPage = 0;
        let totalPages = 0;
        let pageSize = 25;  // Show 25 items per page (can be changed by user)
        let searchTerm = '';
        let sortColumn = 'id';
        let sortDirection = 'desc';  // 'asc' or 'desc'
        let loadLimit = 10;
        let searchDebounceTimer = null;

        async function loadData() {
            try {
                // Build URL with server-side filters
                const params = new URLSearchParams();
                params.set('offset', '0');
                params.set('limit', String(loadLimit));
                
                // Add search filter (server-side)
                if (searchTerm && searchTerm.trim()) {
                    params.set('search', searchTerm.trim());
                }
                
                // Add "only missing" filter (server-side)
                const onlyMissing = document.getElementById('filterMissing').checked;
                if (onlyMissing) {
                    params.set('only_missing', 'true');
                }

                const response = await fetch(`/api/training-data-images?${params.toString()}`);
                const data = await response.json();
                
                allData = data.images;
                existingData = data.images;  // No client-side filtering needed
                
                // Apply current sort
                sortData();
                
                totalPages = Math.ceil(existingData.length / pageSize);
                
                updateStatistics();
                updateResultCount();
                updateSortIcons();
                renderDataTable(getPaginatedData());
                updatePagination();
                
            } catch (error) {
                showAlert('error', `Error loading data: ${error.message}`);
            }
        }
        
        async function updateStatistics() {
            try {
                // Get total from efficient stats endpoint
                const statsResponse = await fetch('/api/training-data-stats');
                const stats = await statsResponse.json();
                document.getElementById('totalImages').textContent = stats.total;
                
                // Get source counts from filtered queries (they return total in response)
                const matResponse = await fetch('/api/training-data-images?limit=1&source_format=MAT');
                const matData = await matResponse.json();
                document.getElementById('matCount').textContent = matData.total;
                
                const ocsResponse = await fetch('/api/training-data-images?limit=1&source_format=OCS');
                const ocsData = await ocsResponse.json();
                document.getElementById('ocsCount').textContent = ocsData.total;
                
                // Patient count from dataset-info (already optimized)
                const datasetResponse = await fetch('/api/ai-training/dataset-info');
                const dataset = await datasetResponse.json();
                // Approximate patient count from labeled data ratio
                document.getElementById('patientCount').textContent = '~' + Math.round(stats.total / 2);
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        function getFilteredData() {
            return existingData;
        }
        
        function getPaginatedData() {
            const start = currentPage * pageSize;
            const end = start + pageSize;
            return existingData.slice(start, end);
        }
        
        function updateResultCount() {
            const countElement = document.getElementById('resultCount');
            if (!countElement) {
                return;
            }
            const count = existingData.length;
            countElement.textContent = `${count} ${count === 1 ? 'item' : 'items'}`;
            
            // Change color if filtered
            const onlyMissing = document.getElementById('filterMissing').checked;
            if (searchTerm && searchTerm.trim() !== '' || onlyMissing) {
                countElement.style.background = '#28a745';  // Green when filtering
            } else {
                countElement.style.background = '#667eea';  // Default blue
            }
        }
        
        function searchData() {
            // Debounce search to avoid too many API calls
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                searchTerm = document.getElementById('searchInput').value;
                currentPage = 0;
                loadData();
            }, 300);
        }

        function changeLoadLimit(value) {
            loadLimit = parseInt(value) || 100;
            currentPage = 0;
            loadData();
        }
        
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterMissing').checked = false;
            searchTerm = '';
            currentPage = 0;
            loadData();
        }

        function sortData() {
            // Sort existingData based on current sortColumn and sortDirection
            existingData.sort((a, b) => {
                let valA, valB;
                
                switch(sortColumn) {
                    case 'id':
                        valA = a.id;
                        valB = b.id;
                        break;
                    case 'patient':
                        valA = a.patient_id.toLowerCase();
                        valB = b.patient_id.toLowerCase();
                        break;
                    case 'task':
                        valA = a.task_type.toLowerCase();
                        valB = b.task_type.toLowerCase();
                        break;
                    case 'source':
                        valA = a.source_format.toLowerCase();
                        valB = b.source_format.toLowerCase();
                        break;
                    case 'resolution':
                        valA = a.width * a.height;
                        valB = b.width * b.height;
                        break;
                    case 'filename':
                        valA = a.original_filename.toLowerCase();
                        valB = b.original_filename.toLowerCase();
                        break;
                    case 'date':
                        valA = new Date(a.uploaded_at).getTime();
                        valB = new Date(b.uploaded_at).getTime();
                        break;
                    case 'features':
                        // Sort by Total_Score (rows without a score sort to the bottom)
                        valA = (a.total_score !== null && a.total_score !== undefined) ? a.total_score : -Infinity;
                        valB = (b.total_score !== null && b.total_score !== undefined) ? b.total_score : -Infinity;
                        break;
                    default:
                        return 0;
                }
                
                // Compare
                let comparison = 0;
                if (valA < valB) comparison = -1;
                if (valA > valB) comparison = 1;
                
                // Apply direction
                return sortDirection === 'asc' ? comparison : -comparison;
            });
        }
        
        function sortBy(column) {
            // Toggle direction if same column, otherwise default to desc
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'desc';
            }
            
            // Sort and update UI
            sortData();
            updateSortIcons();
            currentPage = 0;  // Reset to first page
            renderDataTable(getPaginatedData());
            updatePagination();
        }
        
        function updateSortIcons() {
            // Reset all icons
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.classList.remove('active');
                icon.textContent = '↕';
            });
            
            // Set active icon
            const activeIcon = document.getElementById(`sort-${sortColumn}`);
            if (activeIcon) {
                activeIcon.classList.add('active');
                activeIcon.textContent = sortDirection === 'asc' ? '↑' : '↓';
            }
        }
        
        function renderDataTable(images) {
            const container = document.getElementById('dataRows');
            
            if (images.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No training data found</h3>
                        <p>Import training data via the unified import pipeline.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = images.map((img, pageIndex) => {
                // Find real index in existingData for correct preview
                const realIndex = existingData.findIndex(item => item.id === img.id);
                
                const date = new Date(img.uploaded_at).toLocaleDateString();
                const shortFilename = img.original_filename.length > 30 
                    ? img.original_filename.substring(0, 27) + '...' 
                    : img.original_filename;
                
                let featuresBadge;
                if (img.has_features) {
                    const scorePart = (img.total_score !== null && img.total_score !== undefined)
                        ? `<span class="badge has-features" title="Total_Score">Σ ${img.total_score}</span>`
                        : '<span class="badge has-features">✓ Set</span>';
                    const compPart = img.has_components
                        ? ' <span class="badge has-features" style="background:#ede7f6;color:#5a3d99;" title="60 component sub-labels present">🧩 60</span>'
                        : '';
                    featuresBadge = scorePart + compPart;
                } else {
                    featuresBadge = '<span class="badge missing-features">MISSING</span>';
                }
                
                return `
                    <div class="data-row" onclick="showPreview(${realIndex})">
                        <div class="data-cell">${img.id}</div>
                        <div class="data-cell">${img.patient_id}</div>
                        <div class="data-cell"><span class="badge ${img.task_type.toLowerCase()}">${img.task_type}</span></div>
                        <div class="data-cell"><span class="badge ${img.source_format.toLowerCase()}">${img.source_format}</span></div>
                        <div class="data-cell" style="font-size: 0.8em;">${img.width}×${img.height}</div>
                        <div class="data-cell">${date}</div>
                        <div class="data-cell">${featuresBadge}</div>
                        <div class="data-cell" style="font-size: 0.8em;" title="${img.original_filename}">${shortFilename}</div>
                        <div class="data-cell">
                            <span class="delete-icon" onclick="event.stopPropagation(); deleteImage(${img.id}, '${img.patient_id}')" title="Delete">🗑️</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function deleteImage(imageId, patientId) {
            // Confirm deletion
            if (!confirm(`Are you sure you want to delete training data image #${imageId} (${patientId})?\n\nThis action cannot be undone.`)) {
                return;
            }
            
            try {
                // Call API to delete
                const response = await fetch(`/api/training-data-image/${imageId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete image');
                }
                
                // Success - reload data
                alert(`✓ Image #${imageId} deleted successfully!`);
                await loadData();
                
            } catch (error) {
                console.error('Error deleting image:', error);
                alert('❌ Error deleting image: ' + error.message);
            }
        }
        
        async function showPreview(index) {
            const img = existingData[index];
            const modal = document.getElementById('previewModal');
            const modalImages = document.getElementById('modalImages');
            
            document.getElementById('modalTitle').textContent = `${img.patient_id} - ${img.task_type}`;
            document.getElementById('modalSubtitle').textContent = 
                `Source: ${img.source_format} | Original: ${img.original_filename}`;
            
            // Load features
            let featuresData = {};
            try {
                const response = await fetch(`/api/training-data-image/${img.id}/features`);
                const data = await response.json();
                featuresData = data.features || {};
            } catch (error) {
                console.error('Error loading features:', error);
            }
            
            // For both MAT and OCS: Show Original + Processed
            // MAT: API extracts unoptimized drawing on-the-fly
            // OCS: API returns actual original PNG
            const sourceLabel = img.source_format === 'MAT' 
                ? '📊 Original Drawing (from .mat)' 
                : '📷 Original Uploaded';
            
            const sourceDesc = img.source_format === 'MAT'
                ? 'Unoptimized drawing from MATLAB file'
                : 'Human rating with red pixels';
            
            const isMAT = img.source_format === 'MAT';
            
            // Add cache buster to force reload
            const cacheBuster = Date.now();
            
            const imagesHtml = `
                <div class="modal-images-row">
                    <div class="modal-image-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h3 style="margin: 0;">${sourceLabel}</h3>
                            <button id="cropBtn" class="btn btn-small" onclick="startCropMode(${img.id})" style="background: #17a2b8; padding: 6px 12px;">
                                ✂️ Crop
                            </button>
                        </div>
                        <div id="cropContainer" style="position: relative; display: inline-block;">
                            <img id="originalImg" src="/api/training-data-image/${img.id}/original?v=${cacheBuster}" alt="Original" style="max-width: 100%;">
                            <canvas id="cropCanvas" style="position: absolute; top: 0; left: 0; display: none; cursor: crosshair;"></canvas>
                        </div>
                        <div id="cropControls" style="display: none; margin-top: 10px; padding: 10px; background: #e3f2fd; border-radius: 6px;">
                            <p style="margin: 0 0 10px 0; color: #1565c0; font-weight: 600;">📍 Click two points to define crop area</p>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn btn-small" onclick="applyCrop(${img.id})" style="background: #28a745;" id="applyCropBtn" disabled>
                                    ✓ Apply Crop & Re-Optimize
                                </button>
                                <button class="btn btn-small btn-secondary" onclick="cancelCrop()">
                                    ✕ Cancel
                                </button>
                            </div>
                        </div>
                        <p style="color: #999; font-size: 0.85em; margin-top: 5px; text-align: center;">
                            ${isMAT ? 'Unoptimized, original thickness' : 'With red pixels and grid'}
                        </p>
                        <div class="image-meta">
                            <p><strong>Image ID:</strong> ${img.id}</p>
                            <p><strong>Patient:</strong> ${img.patient_id}</p>
                            <p><strong>Task:</strong> ${img.task_type}</p>
                            <p><strong>Source:</strong> ${sourceDesc}</p>
                        </div>
                    </div>
                    
                    <div class="modal-image-section">
                        <h3>✨ Optimized (CNN-Ready)</h3>
                        <img id="processedImg" src="/api/training-data-image/${img.id}/processed?v=${cacheBuster}" 
                             alt="Processed" 
                             style="border: 2px solid #28a745;">
                        <p style="color: #28a745; font-size: 0.85em; margin-top: 5px; text-align: center;">
                            Auto-cropped, normalized, CNN-ready
                        </p>
                        <div class="image-meta">
                            <p><strong>Resolution:</strong> ${img.width}×${img.height}px</p>
                            <p><strong>Line Thickness:</strong> 2.00px (normalized)</p>
                            <p><strong>Format:</strong> Black-on-white PNG</p>
                            <p><strong>Auto-cropped:</strong> 5px padding</p>
                        </div>
                    </div>
                </div>
            `;
            
            // Add Feature Editor Section
            const featuresList = Object.keys(featuresData).length > 0
                ? Object.entries(featuresData).map(([key, value]) => {
                    // Escape for HTML display
                    const safeKey = key.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

                    // components are shown in their own table above — skip here
                    if (key === 'components') return '';

                    // Handle Custom_Class differently
                    if (key === 'Custom_Class' && typeof value === 'object') {
                        // Display Custom_Class structure
                        const customClassHtml = Object.entries(value).map(([numClasses, classData]) => {
                            const name = classData.name_custom || classData.name_generic || `Class ${classData.label}`;
                            return `
                                <div class="feature-item" style="margin-left: 20px; border-left: 3px solid #667eea; padding-left: 10px;">
                                    <span class="feature-key">🏷️ ${numClasses} Classes</span>
                                    <div style="display: flex; gap: 10px; align-items: center;">
                                        <span class="feature-value" title="Label: ${classData.label}, Range: ${JSON.stringify(classData.boundaries)}">${name}</span>
                                        <span style="color: #999; font-size: 0.85em;">(Label: ${classData.label})</span>
                                    </div>
                                </div>
                            `;
                        }).join('');
                        
                        return `
                            <div class="feature-item" style="background: #f8f9fa;">
                                <span class="feature-key" style="font-weight: 600;">Custom_Class</span>
                                <span class="feature-value" style="color: #667eea;">${Object.keys(value).length} classification(s)</span>
                            </div>
                            ${customClassHtml}
                        `;
                    }
                    
                    // Regular feature
                    return `
                        <div class="feature-item">
                            <span class="feature-key">${safeKey}</span>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span class="feature-value">${value}</span>
                                <button class="delete-feature-btn" 
                                        data-image-id="${img.id}" 
                                        data-feature-key="${safeKey}" 
                                        style="background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.85em;">×</button>
                            </div>
                        </div>
                    `;
                }).join('')
                : '<p style="color: #999; text-align: center; padding: 10px;">No features set yet</p>';
            
            // Component evaluation (20 elements × Presence/Accuracy/Position), if labelled
            let componentsHtml = '';
            const comp = featuresData.components;
            if (comp && comp.presence && comp.accuracy && comp.position) {
                const elements = [];
                for (let e = 0; e < 20; e++) {
                    elements.push({
                        element: e + 1,
                        presence: comp.presence[e], accuracy: comp.accuracy[e], position: comp.position[e],
                        subscore_hard: (comp.presence[e] + comp.accuracy[e] + comp.position[e])
                    });
                }
                const total = elements.reduce((s, x) => s + x.subscore_hard, 0);
                componentsHtml = `
                    <div style="margin-top: 16px;">
                        <h4 style="margin: 0 0 8px 0; color: #444;">🧩 Component Labels (20 elements × Presence/Accuracy/Position)</h4>
                        ${renderComponentBreakdown({total_score_hard: total, total_score_soft: total, elements: elements},
                                                   {isLabels: true, title: 'Total_Score (ground-truth labels)'})}
                    </div>
                `;
            } else {
                componentsHtml = `
                    <div style="margin-top: 16px;">
                        <h4 style="margin: 0 0 8px 0; color: #444;">🧩 Component Labels</h4>
                        <p style="color: #999; margin: 0; font-size: 0.9em;">
                            No component labels for this image (source: ${img.source_format || 'unknown'}) — only Total_Score is available.
                            Component labels (60 sub-labels) currently exist for TELEFRED, ALGORITHM and OCS_MACHINE sources.
                        </p>
                    </div>
                `;
            }

            const featureEditor = `
                <div class="feature-editor" data-current-image-id="${img.id}">
                    <h3>🏷️ Features & Labels (for CNN Training)</h3>
                    <div class="feature-input-group">
                        <input type="text" id="featureKey" placeholder="Feature name (e.g., quality_score)" />
                        <input type="number" id="featureValue" placeholder="Numeric value (e.g., 0.85)" step="any" />
                        <button class="btn btn-small add-feature-btn" style="white-space: nowrap;">+ Add</button>
                    </div>
                    <div class="feature-list" id="featuresList">
                        ${featuresList}
                    </div>
                    ${componentsHtml}
                </div>
            `;

            modalImages.innerHTML = imagesHtml + featureEditor;

            // Add event listeners for buttons (event delegation)
            setTimeout(() => {
                // Add feature button
                const addBtn = document.querySelector('.add-feature-btn');
                if (addBtn) {
                    addBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await addFeature(img.id);
                    });
                }
                
                // Delete feature buttons
                document.querySelectorAll('.delete-feature-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const imageId = parseInt(btn.getAttribute('data-image-id'));
                        const featureKey = btn.getAttribute('data-feature-key');
                        await deleteFeature(imageId, featureKey);
                    });
                });
            }, 0);
            
            modal.classList.add('show');
        }
        
        async function addFeature(imageId) {
            const key = document.getElementById('featureKey').value.trim();
            const value = parseFloat(document.getElementById('featureValue').value);
            
            if (!key || isNaN(value)) {
                alert('Please enter both feature name and numeric value');
                return;
            }
            
            // Get current features
            const response = await fetch(`/api/training-data-image/${imageId}/features`);
            const data = await response.json();
            const features = data.features || {};
            
            // Add new feature
            features[key] = value;
            
            // Save
            await fetch(`/api/training-data-image/${imageId}/features`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(features)
            });
            
            // Reload data and re-open modal
            await loadData();
            const newIndex = existingData.findIndex(img => img.id === imageId);
            if (newIndex >= 0) {
                showPreview(newIndex);
            }
        }
        
        async function deleteFeature(imageId, featureKey) {
            // Get current features
            const response = await fetch(`/api/training-data-image/${imageId}/features`);
            const data = await response.json();
            const features = data.features || {};
            
            // Delete feature
            delete features[featureKey];
            
            // Save
            await fetch(`/api/training-data-image/${imageId}/features`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(features)
            });
            
            // Reload data and re-open modal
            await loadData();
            const newIndex = existingData.findIndex(img => img.id === imageId);
            if (newIndex >= 0) {
                showPreview(newIndex);
            }
        }
        
        function closeModal() {
            cancelCrop();  // Clean up crop mode if active
            document.getElementById('previewModal').classList.remove('show');
        }
        
        // Crop functionality
        let cropState = {
            active: false,
            imageId: null,
            point1: null,
            point2: null,
            naturalWidth: 0,
            naturalHeight: 0
        };
        
        function startCropMode(imageId) {
            const img = document.getElementById('originalImg');
            const canvas = document.getElementById('cropCanvas');
            const controls = document.getElementById('cropControls');
            const cropBtn = document.getElementById('cropBtn');
            
            // Wait for image to load
            if (!img.complete) {
                img.onload = () => startCropMode(imageId);
                return;
            }
            
            // Store natural dimensions for coordinate conversion
            cropState.naturalWidth = img.naturalWidth;
            cropState.naturalHeight = img.naturalHeight;
            cropState.imageId = imageId;
            cropState.active = true;
            cropState.point1 = null;
            cropState.point2 = null;
            
            // Setup canvas
            canvas.width = img.offsetWidth;
            canvas.height = img.offsetHeight;
            canvas.style.display = 'block';
            canvas.style.width = img.offsetWidth + 'px';
            canvas.style.height = img.offsetHeight + 'px';
            
            // Show controls
            controls.style.display = 'block';
            cropBtn.style.display = 'none';
            document.getElementById('applyCropBtn').disabled = true;
            
            // Add click listener
            canvas.onclick = handleCropClick;
            canvas.onmousemove = handleCropMouseMove;
        }
        
        function handleCropClick(e) {
            if (!cropState.active) return;
            
            const canvas = document.getElementById('cropCanvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (!cropState.point1) {
                cropState.point1 = { x, y };
                drawCropOverlay();
            } else if (!cropState.point2) {
                cropState.point2 = { x, y };
                drawCropOverlay();
                document.getElementById('applyCropBtn').disabled = false;
            } else {
                // Reset and start new selection
                cropState.point1 = { x, y };
                cropState.point2 = null;
                document.getElementById('applyCropBtn').disabled = true;
                drawCropOverlay();
            }
        }
        
        function handleCropMouseMove(e) {
            if (!cropState.active || !cropState.point1 || cropState.point2) return;
            
            const canvas = document.getElementById('cropCanvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            drawCropOverlay({ x, y });
        }
        
        function drawCropOverlay(tempPoint2 = null) {
            const canvas = document.getElementById('cropCanvas');
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw semi-transparent overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (cropState.point1) {
                const p2 = cropState.point2 || tempPoint2;
                
                // Draw first point
                ctx.fillStyle = '#ff5722';
                ctx.beginPath();
                ctx.arc(cropState.point1.x, cropState.point1.y, 6, 0, Math.PI * 2);
                ctx.fill();
                
                if (p2) {
                    // Draw rectangle
                    const x1 = Math.min(cropState.point1.x, p2.x);
                    const y1 = Math.min(cropState.point1.y, p2.y);
                    const x2 = Math.max(cropState.point1.x, p2.x);
                    const y2 = Math.max(cropState.point1.y, p2.y);
                    const width = x2 - x1;
                    const height = y2 - y1;
                    
                    // Clear rectangle area (show original image)
                    ctx.clearRect(x1, y1, width, height);
                    
                    // Draw rectangle border
                    ctx.strokeStyle = '#ff5722';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(x1, y1, width, height);
                    ctx.setLineDash([]);
                    
                    // Draw second point
                    ctx.fillStyle = '#ff5722';
                    ctx.beginPath();
                    ctx.arc(p2.x, p2.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Show dimensions
                    const scaleX = cropState.naturalWidth / canvas.width;
                    const scaleY = cropState.naturalHeight / canvas.height;
                    const realWidth = Math.round(width * scaleX);
                    const realHeight = Math.round(height * scaleY);
                    
                    ctx.fillStyle = '#ff5722';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText(`${realWidth} × ${realHeight} px`, x1 + 5, y1 - 8);
                }
            }
        }
        
        function cancelCrop() {
            cropState.active = false;
            cropState.point1 = null;
            cropState.point2 = null;
            
            const canvas = document.getElementById('cropCanvas');
            const controls = document.getElementById('cropControls');
            const cropBtn = document.getElementById('cropBtn');
            
            if (canvas) {
                canvas.style.display = 'none';
                canvas.onclick = null;
                canvas.onmousemove = null;
            }
            if (controls) controls.style.display = 'none';
            if (cropBtn) cropBtn.style.display = 'inline-block';
        }
        
        async function applyCrop(imageId) {
            if (!cropState.point1 || !cropState.point2) return;
            
            const canvas = document.getElementById('cropCanvas');
            const scaleX = cropState.naturalWidth / canvas.width;
            const scaleY = cropState.naturalHeight / canvas.height;
            
            // Calculate crop coordinates in original image pixels
            const x1 = Math.round(Math.min(cropState.point1.x, cropState.point2.x) * scaleX);
            const y1 = Math.round(Math.min(cropState.point1.y, cropState.point2.y) * scaleY);
            const x2 = Math.round(Math.max(cropState.point1.x, cropState.point2.x) * scaleX);
            const y2 = Math.round(Math.max(cropState.point1.y, cropState.point2.y) * scaleY);
            
            const applyBtn = document.getElementById('applyCropBtn');
            applyBtn.disabled = true;
            applyBtn.textContent = '⏳ Processing...';
            
            try {
                const response = await fetch(`/api/training-data-image/${imageId}/crop-and-reprocess`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x1, y1, x2, y2 })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Crop failed');
                }
                
                const result = await response.json();
                
                // Show loading state on processed image
                const processedImg = document.getElementById('processedImg');
                processedImg.style.opacity = '0.3';
                processedImg.style.border = '3px solid #ffc107';
                
                // Force reload processed image with cache buster
                const newSrc = `/api/training-data-image/${imageId}/processed?v=${Date.now()}`;
                
                // Create new image to preload
                const preloadImg = new Image();
                preloadImg.onload = () => {
                    processedImg.src = newSrc;
                    processedImg.style.opacity = '1';
                    processedImg.style.border = '3px solid #28a745';
                    
                    // Flash animation to highlight update
                    processedImg.style.transition = 'box-shadow 0.3s';
                    processedImg.style.boxShadow = '0 0 20px #28a745';
                    setTimeout(() => {
                        processedImg.style.boxShadow = 'none';
                    }, 1000);
                };
                preloadImg.src = newSrc;
                
                cancelCrop();
                showAlert('success', `✓ Image cropped and re-optimized! (${result.crop.x1},${result.crop.y1}) to (${result.crop.x2},${result.crop.y2})`);
                
                // Reload data to update table
                await loadData();
                
            } catch (error) {
                showAlert('error', `Crop failed: ${error.message}`);
                applyBtn.disabled = false;
                applyBtn.textContent = '✓ Apply Crop & Re-Optimize';
            }
        }
        
        function updatePagination() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1 || totalPages === 0;
            
            // Update items info
            const filteredData = getFilteredData();
            const totalItems = filteredData.length;
            const startItem = currentPage * pageSize + 1;
            const endItem = Math.min((currentPage + 1) * pageSize, totalItems);
            
            if (totalItems > 0) {
                document.getElementById('itemsInfo').textContent = `Showing ${startItem}-${endItem} of ${totalItems} items`;
            } else {
                document.getElementById('itemsInfo').textContent = '';
            }
        }
        
        function changePage(delta) {
            currentPage += delta;
            if (currentPage < 0) currentPage = 0;
            if (currentPage >= totalPages) currentPage = totalPages - 1;
            
            // Re-render with new page (no need to reload from API)
            renderDataTable(getPaginatedData());
            updatePagination();
        }
        
        function changePageSize(newSize) {
            pageSize = parseInt(newSize);
            currentPage = 0;  // Reset to first page when changing page size
            
            // Recalculate pagination
            const filteredData = getFilteredData();
            totalPages = Math.ceil(filteredData.length / pageSize);
            
            // Re-render with new page size
            renderDataTable(getPaginatedData());
            updatePagination();
        }
        
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert ${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 8000);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
