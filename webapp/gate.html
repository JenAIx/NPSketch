<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPSketch — Zugang</title>
    <!-- Self-contained on purpose: this page is served WITHOUT the auth gate,
         so it must not depend on any other (gated) asset. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .logo { font-size: 2.2rem; margin-bottom: 6px; }
        h1 { font-size: 1.5rem; color: #4a4a6a; margin-bottom: 6px; }
        p.sub { color: #777; font-size: 0.95rem; margin-bottom: 26px; }
        label { display: block; text-align: left; font-size: 0.85rem; color: #555; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 2px solid #e0e0e8;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus { border-color: #667eea; }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button:hover { box-shadow: 0 6px 18px rgba(102, 126, 234, 0.45); }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.6; cursor: default; box-shadow: none; }
        .error {
            margin-top: 16px;
            color: #c0392b;
            font-size: 0.9rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔒</div>
        <h1>NPSketch</h1>
        <p class="sub">Bitte gib das Zugangs-Token ein.</p>
        <form id="gate-form" autocomplete="off">
            <label for="token">Zugangs-Token</label>
            <input type="password" id="token" name="token" autofocus autocomplete="current-password" />
            <button type="submit" id="submit-btn">Entsperren</button>
        </form>
        <div class="error" id="error"></div>
    </div>

    <script>
        const form = document.getElementById('gate-form');
        const input = document.getElementById('token');
        const btn = document.getElementById('submit-btn');
        const errorEl = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: input.value })
                });
                if (res.ok) {
                    // Session cookie is set; go to the app.
                    window.location.replace('/');
                    return;
                }
                if (res.status === 503) {
                    errorEl.textContent = 'Server: kein Zugangs-Token konfiguriert.';
                } else {
                    errorEl.textContent = 'Falsches Token. Bitte erneut versuchen.';
                }
            } catch (err) {
                errorEl.textContent = 'Netzwerkfehler. Bitte erneut versuchen.';
            } finally {
                btn.disabled = false;
                input.select();
            }
        });
    </script>
</body>
</html>
