services:
  nginx:
    image: nginx:latest
    container_name: npsketch-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - npsketch-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: npsketch-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:rw
      - ./templates:/app/templates:ro
      - ./api:/app:rw
    environment:
      - PYTHONUNBUFFERED=1
      # Shared access token for the auth gate — substituted from the root .env
      # (kept out of the container image; .env is gitignored).
      - NPSKETCH_ACCESS_TOKEN=${NPSKETCH_ACCESS_TOKEN}
    networks:
      - npsketch-network

  # External access (e.g. from a tablet) via a Cloudflare tunnel to nginx.
  # Default = Quick Tunnel (no Cloudflare account): a random public
  #   https://<random>.trycloudflare.com  URL is printed in the logs:
  #     docker compose logs cloudflared | grep trycloudflare.com
  # NOTE: that URL is PUBLIC (anyone with it reaches the app) and changes on each restart.
  # For a STABLE, optionally access-restricted URL, create a named tunnel in the Cloudflare
  # dashboard, put its token in a .env file as CLOUDFLARE_TUNNEL_TOKEN=..., and replace the
  # command below with:   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: npsketch-cloudflared
    restart: unless-stopped
    env_file:
      - .env
    # --metrics exposes /ready (connection status) and /quicktunnel (the public hostname)
    # on the internal network, which the API reads for the admin "External Access" panel.
    #
    # Named tunnel (stable subdomain, e.g. https://npsketch.jenai.de):
    #   the ingress rule (npsketch.jenai.de -> http://nginx:80) is configured in the
    #   Cloudflare dashboard on the tunnel; the token is read from .env.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # Quick Tunnel fallback (random public https://<random>.trycloudflare.com, no account):
    #   command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - npsketch-network

networks:
  npsketch-network:
    driver: bridge

