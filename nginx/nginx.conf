events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    
    # Allow large file uploads (MAT files can be ~200MB each)
    client_max_body_size 500M;

    server {
        listen 80;
        server_name localhost;

        # Behind the Cloudflare tunnel nginx only sees plain http; keep redirects
        # relative so the browser stays on https (no http downgrade hop).
        absolute_redirect off;

        # Root directory for static webapp files
        root /usr/share/nginx/html;
        index index.html;

        # --- Access-token gate ---------------------------------------------
        # The gate page and static assets are served without a session check;
        # every HTML route below requires a valid session cookie (verified by
        # the FastAPI backend via auth_request) or the visitor is redirected to
        # the gate. The /api/* surface is guarded authoritatively by the backend
        # middleware, so it needs no auth_request here.

        # Gate page itself — must stay reachable while logged out.
        location = /gate.html {
        }

        # Static assets (no sensitive data) — skip the gate for performance.
        location /css/ {
        }
        location /js/ {
        }

        # Serve static webapp files; gate every HTML route.
        location / {
            auth_request /_authcheck;
            error_page 401 = @gate;
            try_files $uri $uri/ /index.html;
        }

        # Internal subrequest: 200 if the session cookie is valid, else 401.
        location = /_authcheck {
            internal;
            proxy_pass http://api:8000/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # Unauthenticated visitors land on the gate page.
        location @gate {
            return 302 /gate.html;
        }

        # Proxy all /api/ requests to FastAPI backend
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

